<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCD 還是 LCM？品頤的判斷特訓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7EF;--paper:#FFFDFA;--ink:#3A2E39;
    --grape:#7C5CBF;--grape-soft:#EDE6FA;
    --mint:#2FB79A;--mint-soft:#DFF5EF;--mint-deep:#1E8A73;
    --coral:#FF7A85;--coral-soft:#FFE4E6;
    --sun:#FFC24B;--sun-soft:#FFF0D0;
    --sky:#4DA6E8;--sky-soft:#E1F0FC;--sky-deep:#2A7BB8;--line:#EBDFD4;
    --shadow:rgba(124,92,191,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Noto Sans TC",sans-serif;
    background:radial-gradient(circle at 12% 8%,#FFEFDE 0%,transparent 42%),radial-gradient(circle at 88% 4%,#F0E9FB 0%,transparent 40%),var(--cream);
    color:var(--ink);min-height:100vh;padding:22px 16px 80px;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:640px;margin:0 auto}

  header{text-align:center;margin-bottom:16px}
  .eyebrow{font-family:"Baloo 2",cursive;display:inline-block;background:var(--grape);color:#fff;padding:4px 16px;border-radius:999px;font-size:13.5px;font-weight:700;box-shadow:0 4px 0 #6247A0;transform:rotate(-2deg)}
  h1{font-family:"Baloo 2",cursive;font-size:28px;line-height:1.2;font-weight:800;margin:12px 0 4px}
  .sub{font-size:14px;color:#8A7A86;font-weight:500;line-height:1.5}

  /* ---- visual compare table ---- */
  .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:0;margin:18px 0 20px;border-radius:20px;overflow:hidden;box-shadow:0 10px 26px -14px var(--shadow);border:2px solid var(--line)}
  .vs-col{padding:16px 13px;text-align:center}
  .vs-col.g{background:var(--mint-soft)}
  .vs-col.l{background:var(--sky-soft)}
  .vs-mid{background:#fff;display:flex;align-items:center;justify-content:center;font-family:"Baloo 2",cursive;font-weight:800;color:#C9B8A8;font-size:18px;padding:0 4px}
  .vs-icon{font-size:34px;line-height:1;margin-bottom:6px}
  .vs-name{font-family:"Baloo 2",cursive;font-weight:800;font-size:15px;margin-bottom:2px}
  .vs-col.g .vs-name{color:var(--mint-deep)}
  .vs-col.l .vs-name{color:var(--sky-deep)}
  .vs-sub{font-size:11.5px;font-weight:700;color:#9C8B98;margin-bottom:10px}
  .vs-move{font-family:"Baloo 2",cursive;font-weight:800;font-size:20px;margin-bottom:10px}
  .vs-col.g .vs-move{color:var(--mint)}
  .vs-col.l .vs-move{color:var(--sky)}
  .vs-kw{font-size:11.5px;line-height:1.7;color:#5A4E56;text-align:left;background:rgba(255,255,255,.6);border-radius:10px;padding:9px 10px}
  .vs-kw b{font-weight:700}
  .vs-col.g .vs-kw b{color:var(--mint-deep)}
  .vs-col.l .vs-kw b{color:var(--sky-deep)}

  .oneline{background:linear-gradient(135deg,#FFFDFA,#FFF6EC);border:2px dashed var(--sun);border-radius:16px;padding:13px 16px;margin-bottom:20px;text-align:center;font-size:14.5px;font-weight:700;color:#B8801A;line-height:1.7}
  .oneline .g{color:var(--mint-deep)}
  .oneline .l{color:var(--sky-deep)}

  .tracker{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 15px;margin-bottom:18px;box-shadow:0 8px 22px -12px var(--shadow);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .tracker-label{font-size:13px;font-weight:700;color:#8A7A86}
  .score-badge{font-family:"Baloo 2",cursive;font-weight:800;font-size:14px;color:var(--grape);background:var(--grape-soft);padding:3px 12px;border-radius:999px}
  .dots{display:flex;gap:5px;flex-wrap:wrap}
  .dot{width:24px;height:24px;border-radius:8px;background:#F0E7DD;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#C9B8A8;font-family:"Baloo 2",cursive;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s}
  .dot.done{background:var(--mint);color:#fff;transform:scale(1.05)}
  .dot.miss{background:var(--coral);color:#fff}
  .dot.current{outline:3px solid var(--sun);outline-offset:2px}

  .card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:20px 18px 22px;box-shadow:0 14px 30px -16px var(--shadow)}
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
  .qnum{font-family:"Baloo 2",cursive;font-weight:800;font-size:14px;color:var(--grape)}
  .qtag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px}
  .qtag.warm{background:var(--mint-soft);color:var(--mint-deep)}
  .qtag.exam{background:var(--coral-soft);color:#D64A57}

  .prompt{font-size:12.5px;font-weight:700;color:#8A7A86;margin-bottom:8px;text-align:center}
  .qtext{font-size:16.5px;line-height:1.9;font-weight:500;margin-bottom:8px;background:#FBF7F1;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
  .qtext .hl{background:var(--sun-soft);padding:1px 4px;border-radius:5px;font-weight:700;color:#B8801A}
  .examfrom{font-size:11px;color:#C9A56A;font-weight:700;text-align:right;margin-bottom:14px}

  /* big two-choice buttons */
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px}
  .choice{font-family:inherit;border:2.5px solid var(--line);background:#fff;border-radius:18px;padding:18px 12px;cursor:pointer;transition:transform .12s,border-color .15s,background .15s;text-align:center}
  .choice:hover:not(:disabled){transform:translateY(-3px)}
  .choice:disabled{cursor:default}
  .choice .ci{font-size:30px;line-height:1;margin-bottom:6px}
  .choice .cn{font-family:"Baloo 2",cursive;font-weight:800;font-size:15px;margin-bottom:2px}
  .choice .cd{font-size:11px;font-weight:700;color:#9C8B98}
  .choice.g:hover:not(:disabled){border-color:var(--mint);background:var(--mint-soft)}
  .choice.l:hover:not(:disabled){border-color:var(--sky);background:var(--sky-soft)}
  .choice.g .cn{color:var(--mint-deep)}
  .choice.l .cn{color:var(--sky-deep)}
  .choice.correct{border-color:var(--mint);background:var(--mint-soft);animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
  .choice.wrong{border-color:var(--coral);background:var(--coral-soft)}
  .choice.dim{opacity:.4}
  @keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}

  .feedback{margin-top:16px;border-radius:16px;padding:15px 16px;font-size:14px;line-height:1.7;display:none;animation:pop2 .35s cubic-bezier(.34,1.56,.64,1)}
  .feedback.show{display:block}
  .feedback.good{background:var(--mint-soft);border:2px solid var(--mint)}
  .feedback.bad{background:var(--sun-soft);border:2px solid var(--sun)}
  .fb-title{font-family:"Baloo 2",cursive;font-weight:800;font-size:16px;margin-bottom:8px}
  .feedback.good .fb-title{color:var(--mint-deep)}
  .feedback.bad .fb-title{color:#B8801A}
  .fb-key{background:#fff;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:8px}
  .fb-key .tag{display:inline-block;font-weight:700;color:#fff;padding:1px 8px;border-radius:6px;font-size:12px;margin-right:4px}
  .fb-key .tag.g{background:var(--mint)}
  .fb-key .tag.l{background:var(--sky)}
  .fb-why{font-size:13px;color:#5F5260;line-height:1.65}
  .fb-why b{color:var(--grape)}
  @keyframes pop2{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .next-btn{margin-top:16px;width:100%;font-family:"Baloo 2",cursive;font-size:16px;font-weight:800;color:#fff;background:var(--grape);border:none;padding:14px;border-radius:15px;cursor:pointer;box-shadow:0 5px 0 #6247A0;transition:transform .1s,box-shadow .1s;display:none}
  .next-btn.show{display:block}
  .next-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #6247A0}

  .finish{display:none;text-align:center;padding:10px 0}
  .finish.show{display:block;animation:pop2 .5s cubic-bezier(.34,1.56,.64,1)}
  .trophy{font-size:70px;line-height:1;margin-bottom:8px;display:inline-block;animation:bob 2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
  .finish h2{font-family:"Baloo 2",cursive;font-size:27px;margin-bottom:6px}
  .final-score{font-family:"Baloo 2",cursive;font-size:48px;font-weight:800;color:var(--grape);line-height:1}
  .final-score span{font-size:22px;color:#B8A8C8}
  .finish-msg{font-size:14px;color:#7A6A76;margin:12px 0 18px;line-height:1.7}
  .medals{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .medal{background:var(--sun-soft);border:2px solid var(--sun);border-radius:14px;padding:8px 12px;font-size:12px;font-weight:700;color:#B8801A}
  .replay{font-family:"Baloo 2",cursive;font-size:15px;font-weight:800;color:var(--grape);background:#fff;border:2px solid var(--grape);padding:12px 26px;border-radius:14px;cursor:pointer}
  .replay:active{transform:scale(.96)}

  .confetti{position:fixed;top:-10px;width:11px;height:11px;z-index:99;pointer-events:none;border-radius:2px}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}

  footer{text-align:center;margin-top:24px;font-size:12px;color:#B5A599;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="eyebrow">只判斷，不計算</span>
    <h1>GCD 還是 LCM？</h1>
    <p class="sub">品頤的「秒判斷」特訓 · 看題目長相就知道用哪個</p>
  </header>

  <!-- visual compare -->
  <div class="vs">
    <div class="vs-col g">
      <div class="vs-icon">🔽</div>
      <div class="vs-name">最大公因數</div>
      <div class="vs-sub">GCD</div>
      <div class="vs-move">往下切</div>
      <div class="vs-kw"><b>分東西</b>：分裝、分組、平分、切一樣大、剛好分完、每份相同、最多幾份/最大幾公分</div>
    </div>
    <div class="vs-mid">VS</div>
    <div class="vs-col l">
      <div class="vs-icon">🔼</div>
      <div class="vs-name">最小公倍數</div>
      <div class="vs-sub">LCM</div>
      <div class="vs-move">往上疊</div>
      <div class="vs-kw"><b>等相遇</b>：同時、再次一起、幾天後又碰面、下一次、循環一圈、排成方陣、最少幾個</div>
    </div>
  </div>

  <div class="oneline">
    🔑 一句話記住：<span class="g">分東西 → 最大公因數</span>　｜　<span class="l">等相遇 → 最小公倍數</span>
  </div>

  <div class="tracker">
    <span class="tracker-label">判斷進度</span>
    <span class="score-badge" id="scoreBadge">答對 0 / 12</span>
    <div class="dots" id="dots"></div>
  </div>

  <div class="card" id="card">
    <div class="qhead">
      <span class="qnum" id="qnum">第 1 題</span>
      <span class="qtag warm" id="qtag">暖身</span>
    </div>

    <p class="prompt">👇 讀完題目，這是在問哪一個？</p>
    <div class="qtext" id="qtext"></div>
    <p class="examfrom" id="examfrom"></p>

    <div class="choices">
      <button class="choice g" id="btnG" onclick="choose('gcd',this)">
        <div class="ci">🔽</div>
        <div class="cn">最大公因數</div>
        <div class="cd">分東西 · 往下切</div>
      </button>
      <button class="choice l" id="btnL" onclick="choose('lcm',this)">
        <div class="ci">🔼</div>
        <div class="cn">最小公倍數</div>
        <div class="cd">等相遇 · 往上疊</div>
      </button>
    </div>

    <div class="feedback" id="feedback">
      <div class="fb-title" id="fbTitle"></div>
      <div class="fb-key" id="fbKey"></div>
      <div class="fb-why" id="fbWhy"></div>
    </div>

    <button class="next-btn" id="nextBtn">下一題 →</button>
  </div>

  <div class="finish" id="finish">
    <div class="trophy" id="trophy">🏆</div>
    <h2 id="finishTitle">判斷高手！</h2>
    <div class="final-score"><span id="finalScore">0</span><span> / 12</span></div>
    <p class="finish-msg" id="finishMsg"></p>
    <div class="medals" id="medals"></div>
    <button class="replay" id="replayBtn">🔄 再練一次</button>
  </div>

  <footer>
    品頤的重點只有一個：<b>看出題目在問 GCD 還是 LCM</b><br>
    判斷對了，剩下的計算你本來就會 💪
  </footer>
</div>

<script>
/* concept: 'gcd' | 'lcm' ; each has keyword + why */
const Q=[
  { tag:"暖身",cls:"warm",concept:"gcd",
    text:"把 <span class='hl'>24 顆糖</span> 和 <span class='hl'>36 顆餅乾</span> 分裝成幾袋，每袋<span class='hl'>一樣多</span>、<span class='hl'>不能剩</span>，<span class='hl'>最多</span>幾袋？",
    key:"分裝 · 一樣多 · 最多", keyType:"gcd",
    why:"「把東西分裝、每份一樣、最多」→ 這是<b>分東西</b> → 最大公因數。" },

  { tag:"暖身",cls:"warm",concept:"lcm",
    text:"A 燈每 <span class='hl'>6 秒</span>閃、B 燈每 <span class='hl'>8 秒</span>閃，剛剛<span class='hl'>同時</span>閃，幾秒後<span class='hl'>再次一起</span>閃？",
    key:"同時 · 再次一起", keyType:"lcm",
    why:"「兩件事再次同時發生」→ 這是<b>等相遇</b> → 最小公倍數。" },

  { tag:"暖身",cls:"warm",concept:"gcd",
    text:"一塊 <span class='hl'>長 30、寬 42</span> 的板子，鋪滿<span class='hl'>一樣大的正方形</span>磁磚不切割，<span class='hl'>邊長最大</span>多少？",
    key:"一樣大的正方形 · 最大", keyType:"gcd",
    why:"「切成一樣大、最大」→ 邊長要能整除兩數 → 分東西 → 最大公因數。" },

  { tag:"暖身",cls:"warm",concept:"lcm",
    text:"甲每 <span class='hl'>4 天</span>來一次、乙每 <span class='hl'>6 天</span>來一次，今天一起來，<span class='hl'>下次一起</span>是幾天後？",
    key:"下次一起", keyType:"lcm",
    why:"「下次再一起」→ 等相遇 → 最小公倍數。" },

  { tag:"練習",cls:"warm",concept:"gcd",
    text:"<span class='hl'>60 支筆、48 本本子</span> 平分給同學，每人拿到的<span class='hl'>一樣多</span>且<span class='hl'>剛好分完</span>，<span class='hl'>最多</span>幾人？",
    key:"平分 · 剛好分完 · 最多", keyType:"gcd",
    why:"「平分、剛好分完、最多人」→ 人數要整除兩數 → 分東西 → 最大公因數。" },

  { tag:"練習",cls:"warm",concept:"lcm",
    text:"三種公車間隔 <span class='hl'>10、15、20</span> 分鐘，早上 8:00 <span class='hl'>同時</span>發車，<span class='hl'>下一次同時</span>發車是幾點？",
    key:"同時 · 下一次同時", keyType:"lcm",
    why:"「三個週期再次重疊」→ 等相遇 → 最小公倍數。" },

  { tag:"練習",cls:"warm",concept:"lcm",
    text:"正方形磁磚要<span class='hl'>拼成一個大正方形</span>，用 <span class='hl'>長 8、寬 12</span> 的小磚，大正方形<span class='hl'>最小</span>邊長多少？",
    key:"拼成大正方形 · 最小", keyType:"lcm",
    why:"陷阱！這裡是「小磚<b>疊出</b>大正方形」→ 邊長要是 8、12 的倍數 → 往上疊 → 最小公倍數。（跟切磁磚剛好相反）" },

  { tag:"練習",cls:"warm",concept:"gcd",
    text:"某數除以 <span class='hl'>18 和 24</span> 都<span class='hl'>剛好整除</span>它，且這個數<span class='hl'>最大</span>。它是多少？",
    key:"都整除它 · 最大", keyType:"gcd",
    why:"「一個數能整除 18 和 24、要最大」→ 它是 18、24 的公因數且最大 → 最大公因數。" },

  { tag:"會考模擬",cls:"exam",concept:"lcm",
    text:"蘋果有兩箱共某個數量，用 <span class='hl'>6 個</span>一袋<span class='hl'>剛好裝完</span>，用 <span class='hl'>8 個</span>一袋<span class='hl'>也剛好裝完</span>。總數是多少的倍數？",
    from:"114會考模擬 第11題",
    key:"6裝完、8也裝完", keyType:"lcm",
    why:"關鍵不是「分東西」，是「總數<b>同時</b>能被 6 和 8 裝完」→ 總數是 6、8 的公倍數 → 最小公倍數 24 的倍數。<br>💡 判別訣：問的是「<b>總數</b>本身」→ 通常 LCM；問「<b>分成幾份/每份多少</b>」→ 通常 GCD。" },

  { tag:"會考模擬",cls:"exam",concept:"gcd",
    text:"買便當花 <span class='hl'>720 元</span>、買飲料花 <span class='hl'>450 元</span>，<span class='hl'>每人付的一樣</span>，飲料單價 50~100 元。<span class='hl'>幾個人</span>？",
    from:"114會考模擬 第20題",
    key:"每人一樣 · 幾個人", keyType:"gcd",
    why:"「兩筆總額都要被<b>人數</b>整除、每人付一樣」→ 人數是 720、450 的<b>公因數</b> → 最大公因數家族。<br>💡 跟第11題比：這題問「幾個人（分母/份數）」→ GCD。" },

  { tag:"會考模擬",cls:"exam",concept:"gcd",
    text:"把 <span class='hl'>36、48、60</span> 三種筆平分成數份，每份三種都<span class='hl'>一樣多</span>、<span class='hl'>全部用完</span>，<span class='hl'>最多</span>幾份？",
    from:"公因數應用",
    key:"平分 · 一樣多 · 最多份", keyType:"gcd",
    why:"「平分三個數、每份一樣、最多份」→ 份數是三數的公因數 → 最大公因數。" },

  { tag:"會考模擬",cls:"exam",concept:"lcm",
    text:"某數 <span class='hl'>除以 5、7、9 都餘 3</span>，這個數<span class='hl'>最小</span>是多少（大於3）？",
    from:"餘數型",
    key:"除以幾都餘同一個數 · 最小", keyType:"lcm",
    why:"「除以幾個數都餘同一個」→ (某數−餘數) 是它們的公倍數 → 最小 → 最小公倍數，再加回餘數。" }
];

let idx=0,correct=0,answered=false;
const results=[];
const el=id=>document.getElementById(id);

function buildDots(){
  const d=el("dots");d.innerHTML="";
  Q.forEach((_,i)=>{
    const s=document.createElement("div");
    s.className="dot"+(i===0?" current":"");
    s.textContent=i+1;s.id="dot"+i;
    d.appendChild(s);
  });
}

function render(){
  answered=false;
  const q=Q[idx];
  el("qnum").textContent=`第 ${idx+1} 題`;
  const tag=el("qtag");tag.textContent=q.tag;tag.className="qtag "+q.cls;
  el("qtext").innerHTML=q.text;
  el("examfrom").textContent=q.from?("📋 "+q.from):"";

  ["btnG","btnL"].forEach(id=>{
    const b=el(id);b.disabled=false;
    b.classList.remove("correct","wrong","dim");
  });
  el("feedback").className="feedback";
  el("nextBtn").className="next-btn";
  el("nextBtn").textContent=idx===Q.length-1?"看結果 →":"下一題 →";

  document.querySelectorAll(".dot").forEach((dot,i)=>{
    dot.classList.toggle("current",i===idx&&results[i]===undefined);
  });
}

function choose(val,btn){
  if(answered)return;
  answered=true;
  const q=Q[idx];
  const isRight=val===q.concept;
  results[idx]=isRight;

  el("btnG").disabled=true;el("btnL").disabled=true;
  el("btnG").classList.add("dim");el("btnL").classList.add("dim");
  btn.classList.remove("dim");
  btn.classList.add(isRight?"correct":"wrong");
  if(!isRight){
    const right=el(q.concept==="gcd"?"btnG":"btnL");
    right.classList.remove("dim");right.classList.add("correct");
  }

  const dot=el("dot"+idx);dot.classList.remove("current");
  if(isRight){correct++;dot.classList.add("done");dot.textContent="✓";}
  else{dot.classList.add("miss");dot.textContent="✗";}
  el("scoreBadge").textContent=`答對 ${correct} / 12`;

  const fb=el("feedback");
  fb.className="feedback show "+(isRight?"good":"bad");
  el("fbTitle").textContent=isRight?"🎉 判斷正確！":"🤔 再看一次線索";
  const tagCls=q.keyType==="gcd"?"g":"l";
  const tagName=q.keyType==="gcd"?"最大公因數":"最小公倍數";
  el("fbKey").innerHTML=`關鍵字：<span class="tag ${tagCls}">${tagName}</span> ${q.key}`;
  el("fbWhy").innerHTML=q.why;

  el("nextBtn").className="next-btn show";
  if(isRight)miniConfetti();
}

el("nextBtn").onclick=()=>{
  if(idx<Q.length-1){idx++;render();el("card").scrollIntoView({behavior:"smooth",block:"start"});}
  else finish();
};

function finish(){
  el("card").style.display="none";
  el("finish").classList.add("show");
  el("finalScore").textContent=correct;
  let trophy,title,msg;
  if(correct>=11){trophy="👑";title="判斷之王！";msg="品頤幾乎全對！你已經能一眼看穿題目在問 GCD 還是 LCM。這正是你最需要練的能力，現在練成了 💪";}
  else if(correct>=9){trophy="🏆";title="判斷高手！";msg="很棒！大部分都判斷對了。把答錯那幾題的關鍵字再看一次，特別注意「總數 vs 份數」的差別。";}
  else if(correct>=6){trophy="🥈";title="越來越準了！";msg="進步中！記住那句話：分東西→GCD、等相遇→LCM。會考模擬那幾題再多看幾次線索卡。";}
  else{trophy="🔍";title="再練會更準！";msg="別急品頤～判斷需要練。先把上面的視覺對照表(🔽往下切 vs 🔼往上疊)記熟，再玩一次一定進步！";}
  el("trophy").textContent=trophy;
  el("finishTitle").textContent=title;
  el("finishMsg").innerHTML=msg;

  const medals=[];
  if(correct>=1)medals.push("🎯 開始會判斷");
  if(correct>=6)medals.push("⭐ 判斷過半");
  // exam questions (idx 8-11)
  const examRight=[8,9,10,11].filter(i=>results[i]).length;
  if(examRight>=3)medals.push("📋 會考題判斷達人");
  if(results[6])medals.push("🪤 沒被拼磁磚陷阱騙");
  if(correct>=11)medals.push("💎 判斷全破");
  const mw=el("medals");mw.innerHTML="";
  medals.forEach(m=>{const d=document.createElement("div");d.className="medal";d.textContent=m;mw.appendChild(d);});
  if(correct>=9)bigConfetti();
}

el("replayBtn").onclick=()=>{
  idx=0;correct=0;results.length=0;answered=false;
  el("scoreBadge").textContent="答對 0 / 12";
  el("finish").classList.remove("show");
  el("card").style.display="block";
  buildDots();render();
};

function makeConfetti(n){
  const colors=["#7C5CBF","#2FB79A","#FF7A85","#FFC24B","#4DA6E8"];
  for(let i=0;i<n;i++){
    const c=document.createElement("div");c.className="confetti";
    c.style.left=Math.random()*100+"vw";c.style.background=colors[i%colors.length];
    c.style.animation=`fall ${1+Math.random()*1.2}s ease-in forwards`;
    c.style.animationDelay=Math.random()*.3+"s";
    if(Math.random()>.5)c.style.borderRadius="50%";
    document.body.appendChild(c);setTimeout(()=>c.remove(),2600);
  }
}
const miniConfetti=()=>makeConfetti(14);
const bigConfetti=()=>makeConfetti(64);

buildDots();render();
</script>
</body>
</html>
